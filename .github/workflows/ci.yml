name: CI

# The fast checks run on every push. The full suite (build, browser shards, merged report)
# runs on pull requests and on main; a pull request that changes only Markdown skips it.
# `CI result` is the one required check. Layout and time budget: CLAUDE.md, section "CI".
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Runs on main are never cancelled by a later merge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: PLACEHOLDER

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's checkout is its merge commit; the first parent is the base.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: decide
        run: node scripts/ci/changes.mjs

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          sha256sum "$archive"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" | grep linux_amd64
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      # Coverage instrumentation distorts timings, so the time limits are checked here.
      - name: Unit tests with time limits
        run: npm test

  build:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  e2e-game:
    name: e2e-game (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Browser tests
        run: npx playwright test --project=game --shard=${{ matrix.shard }}/4
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-game-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

  e2e-mp:
    name: e2e-mp (${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Playwright's webServer starts the local signaling server on each runner.
      - name: Browser tests
        run: npx playwright test --project=multiplayer --shard=${{ matrix.shard }}/3
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-mp-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

  report:
    needs: [build, e2e-game, e2e-mp]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: blobs
      # Each shard's blob is merged alone as well: the merged JSON does not name the shard.
      - name: Merge reports
        run: |
          shopt -s nullglob
          mkdir -p merged e2e-timings
          args=()
          for dir in blobs/blob-*; do
            label=${dir#blobs/blob-}
            cp "$dir"/*.zip merged/
            PLAYWRIGHT_JSON_OUTPUT_FILE="e2e-timings/$label.json" \
              npx playwright merge-reports --reporter=json "$dir"
            args+=("${label##*-}=e2e-timings/$label.json")
          done
          PLAYWRIGHT_JSON_OUTPUT_FILE=e2e-timings/merged.json \
            npx playwright merge-reports --reporter=html,json merged
          node scripts/ci/timings.mjs "${args[@]}" > e2e-timings/summary.md
      - name: Timing summary
        run: |
          node -e "const s = require('./e2e-timings/merged.json').stats;
            const n = s.expected + s.unexpected + s.flaky + s.skipped;
            console.log('Merged report: ' + n + ' tests (' + s.unexpected + ' failed, ' +
              s.flaky + ' flaky, ' + s.skipped + ' skipped).\n');" >> "$GITHUB_STEP_SUMMARY"
          cat e2e-timings/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-timings
          path: e2e-timings/
          retention-days: 90
      - name: Upload Playwright report and diff images
        if: needs.e2e-game.result != 'success' || needs.e2e-mp.result != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  ci-result:
    name: CI result
    needs: [changes, checks, build, e2e-game, e2e-mp, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only to name a failed shard; the verdict comes from `needs` alone.
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/ciResult.mjs
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
